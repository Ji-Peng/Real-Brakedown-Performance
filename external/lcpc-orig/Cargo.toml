[package]
name = "lcpc-orig-driver"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
default = []
portable-only = [
    "blake3/pure",
    "blake3/no_sse2",
    "blake3/no_sse41",
    "blake3/no_avx2",
    "blake3/no_avx512",
]

[dependencies]
bincode = "=1.3.3"
blake3 = { version = "=1.8.7", default-features = false, features = ["std", "traits-preview"] }
digest = "=0.9.0"
ff = "=0.12.1"
lcpc-2d = { git = "https://github.com/conroi/lcpc", rev = "f0e2116001af5a1bbf39481535f837d6a25772e8" }
lcpc-brakedown-pc = { git = "https://github.com/conroi/lcpc", rev = "f0e2116001af5a1bbf39481535f837d6a25772e8" }
lcpc-test-fields = { git = "https://github.com/conroi/lcpc", rev = "f0e2116001af5a1bbf39481535f837d6a25772e8" }
merlin = "=2.0.1"
num-traits = "=0.2.19"
rand = "=0.8.8"
rand_chacha = "=0.3.1"
rayon = "=1.12.0"
serde = { version = "=1.0.229", features = ["derive"] }
sprs = "=0.10.0"

[profile.fork-release]
inherits = "release"
codegen-units = 1
lto = "fat"
