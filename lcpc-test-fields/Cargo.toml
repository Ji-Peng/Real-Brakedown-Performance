[package]
name = "lcpc-test-fields"
version = "0.1.0"
authors = ["Riad S. Wahby <rsw@cs.stanford.edu>"]
edition = "2021"
description = "finite fields for lcpc tests"
license = "Apache-2.0"
repository = "https://github.com/conroi/lcpc"
publish = false

[dependencies]
blake3 = { version = "1.8.7", default-features = false, features = ["std", "pure", "no_sse2", "no_sse41", "no_avx2", "no_avx512"] }
digest = "0.10"
err-derive = "0.3"
ff = { version = "0.14", features = ["derive"] }
itertools = "0.14"
lcpc-fields = { path = "../lcpc-fields", version = "0.1.1" }
num-traits = "0.2"
ppv-lite86 = { version = "0.2", default-features = false, features = ["no_simd"] }
rand = "0.10"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
