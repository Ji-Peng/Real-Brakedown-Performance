# Modified 2026 by the RealBrakedownPerf authors (Apache-2.0, see NOTICE):
# edition 2021, current dependencies, lcpc-fields and libc, portable-only BLAKE3.
# The per-commit changes are in the git history since step/00-import
# (upstream conroi/lcpc f0e2116).

[package]
name = "lcpc-brakedown-pc"
version = "0.1.1"
authors = ["kwantam <kwantam@gmail.com>"]
edition = "2021"
description = "polynomial commitment scheme from SDIG expander code"
license = "Apache-2.0"
repository = "https://github.com/conroi/lcpc"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ff = "0.14"
itertools = "0.14"
libc = "0.2"
lcpc-2d = { path = "../lcpc-2d", version = "0.1.1" }
lcpc-fields = { path = "../lcpc-fields", version = "0.1.1" }
num-traits = "0.2"
ppv-lite86 = { version = "0.2", default-features = false, features = ["no_simd"] }
rand = "0.10"
rand_chacha = "0.10"
rayon = "1.11"
typenum = "1.18"

[dev-dependencies]
ndarray = "0.17"
bincode = "1.3"
blake3 = { version = "1.8.7", default-features = false, features = ["std", "pure", "no_sse2", "no_sse41", "no_avx2", "no_avx512"] }
lcpc-test-fields = { path = "../lcpc-test-fields" }
merlin = "3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# test-only: upstream LCPC's per-row sparse-matrix encoder is kept as a reference
sprs = "0.11"
