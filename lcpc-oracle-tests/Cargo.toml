[package]
name = "lcpc-oracle-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dev-dependencies]
bincode = "=1.3.3"
blake3 = { version = "=1.8.7", default-features = false, features = ["std", "pure", "no_sse2", "no_sse41", "no_avx2", "no_avx512"] }
digest-09 = { package = "digest", version = "=0.9.0" }
ff = "0.14"
ff_orig = { package = "ff", version = "=0.12.1" }
lcpc-2d = { path = "../lcpc-2d" }
lcpc-brakedown-pc = { path = "../lcpc-brakedown-pc" }
lcpc-fields = { path = "../lcpc-fields" }
lcpc-test-fields = { path = "../lcpc-test-fields" }
lcpc-orig-2d = { package = "lcpc-2d", git = "https://github.com/conroi/lcpc", rev = "f0e2116001af5a1bbf39481535f837d6a25772e8" }
lcpc-orig-brakedown-pc = { package = "lcpc-brakedown-pc", git = "https://github.com/conroi/lcpc", rev = "f0e2116001af5a1bbf39481535f837d6a25772e8" }
lcpc-orig-test-fields = { package = "lcpc-test-fields", git = "https://github.com/conroi/lcpc", rev = "f0e2116001af5a1bbf39481535f837d6a25772e8" }
merlin = "3.0"
merlin-orig = { package = "merlin", version = "=2.0.1" }
num-traits = "0.2"
rand-orig = { package = "rand", version = "=0.8.8" }
rand-chacha-orig = { package = "rand_chacha", version = "=0.3.1" }
rand-new = { package = "rand", version = "=0.10.3" }
rand-chacha-new = { package = "rand_chacha", version = "=0.10.0" }
serde = { version = "1.0", features = ["derive"] }
sprs = "0.11"
