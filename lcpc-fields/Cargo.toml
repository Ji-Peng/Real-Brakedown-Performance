[package]
name = "lcpc-fields"
version = "0.1.1"
edition = "2021"
description = "64-bit scalar finite fields with lazy modular reduction for LCPC / Brakedown"
license = "Apache-2.0"
repository = "https://github.com/conroi/lcpc"
publish = false

[dependencies]
ff = "0.14"
lcpc-2d = { path = "../lcpc-2d", version = "0.1.1" }
num-traits = "0.2"
rand_core = "0.10"
serde = { version = "1.0", features = ["derive"] }
subtle = "2.6"

[dev-dependencies]
bincode = "1.3"
lcpc-test-fields = { path = "../lcpc-test-fields" }
num-bigint = "0.4"
num-integer = "0.1"
rand = "0.10"
rand_chacha = "0.10"
serde_json = "1.0"
