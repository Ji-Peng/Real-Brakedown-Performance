[package]
name = "lcpc-bench"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Stable Rust benchmark and golden-vector driver for the LCPC workspace"

[lib]
name = "lcpc_bench"
path = "src/lib.rs"

[[bin]]
name = "lcpc-bench"
path = "src/main.rs"

[[bin]]
name = "bench_fields"
path = "src/bin/bench_fields.rs"

[[bin]]
name = "bench_encode"
path = "src/bin/bench_encode.rs"

[[bin]]
name = "bench_pcs"
path = "src/bin/bench_pcs.rs"

[dependencies]
bincode = "1.3"
blake3 = { version = "1.8.7", default-features = false, features = ["std", "pure", "no_sse2", "no_sse41", "no_avx2", "no_avx512"] }
digest = "0.10"
ff = "0.14"
lcpc-2d = { path = "../lcpc-2d" }
lcpc-brakedown-pc = { path = "../lcpc-brakedown-pc" }
lcpc-ligero-pc = { path = "../lcpc-ligero-pc" }
lcpc-fields = { path = "../lcpc-fields" }
lcpc-test-fields = { path = "../lcpc-test-fields" }
merlin = "3.0"
num-traits = "0.2"
rand = "0.10"
rand_chacha = "0.10"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
