# Modified 2026 by the RealBrakedownPerf authors (Apache-2.0, see NOTICE):
# edition 2021, current dependency versions, ppv-lite86 without SIMD.
# The per-commit changes are in the git history since step/00-import
# (upstream conroi/lcpc f0e2116).

[package]
name = "lcpc-2d"
version = "0.1.1"
authors = ["kwantam <kwantam@gmail.com>"]
edition = "2021"
description = "polynomial commitment scheme from linear codes"
license = "Apache-2.0"
repository = "https://github.com/conroi/lcpc"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
digest = "0.10"
err-derive = "0.3"
ff = "0.14"
merlin = "3.0"
ppv-lite86 = { version = "0.2", default-features = false, features = ["no_simd"] }
rand = "0.10"
rand_chacha = "0.10"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"

[dev-dependencies]
bincode = "1.3"
itertools = "0.14"
lcpc-test-fields = { path = "../lcpc-test-fields" }
